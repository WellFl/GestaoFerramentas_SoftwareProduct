<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Troca de Ferramenta - CNC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; margin: 0;">
    <div class="container" style="max-width: 500px;">
        <div class="card card-custom p-4 shadow-lg border-secondary">
            <div class="card-body">
                <div class="text-center mb-4">
                    <span class="badge-posicao fs-4 px-3 py-1 mb-2">{{ troca.posicao }}</span>
                    <h3 class="fw-bold text-white h5 mt-2">{{ troca.nome_ferramenta }}</h3>
                    <p class="text-secondary small">Editando Registro de Substituição #{{ troca.id }}</p>
                </div>

                <div class="p-3 rounded mb-4" style="background-color: #0f172a; border: 1px solid #334155;">
                    <div class="d-flex justify-content-between text-secondary small">
                        <span>Peças Produzidas na Troca:</span>
                        <span class="text-white fw-bold">{{ troca.pecas_produzidas }} / {{ troca.vida_util_limite }} pçs</span>
                    </div>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-light">Nome do Operador:</label>
                        <input type="text" name="operador" class="form-control bg-dark text-white border-secondary" value="{{ troca.operador }}" required placeholder="Digite seu nome completo">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-light">Motivo da Troca:</label>
                        <select name="motivo" class="form-select bg-dark text-white border-secondary" required>
                            <option value="" disabled>Selecione o motivo...</option>
                            <option value="Preventiva" {% if troca.motivo == 'Preventiva' %}selected{% endif %}>Preventiva</option>
                            <option value="Quebra acidental" {% if troca.motivo == 'Quebra acidental' %}selected{% endif %}>Quebra acidental</option>
                            <option value="Quebra por Desgaste" {% if troca.motivo == 'Quebra por Desgaste' %}selected{% endif %}>Quebra por Desgaste</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-light">Data da Troca:</label>
                        <input type="date" name="data" class="form-control bg-dark text-white border-secondary" value="{{ troca.data_troca }}" required>
                    </div>

                    <div class="d-flex gap-2">
                        <a href="{{ url_for('admin.index') }}" class="btn btn-slate w-50 py-2">Cancelar</a>
                        <button type="submit" class="btn btn-blue w-50 py-2 fw-bold">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
