<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Apontamento - CNC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="py-5">
    <div class="container" style="max-width: 650px;">
        <div class="d-flex justify-content-between align-items-center p-3 mb-4 navbar-custom rounded">
            <h1 class="h3 mb-0 text-white">✏️ Editar Apontamento #{{ apontamento.id }}</h1>
            <a href="{{ url_for('admin.index') }}" class="btn btn-blue btn-sm">Voltar ao Painel</a>
        </div>

        <div class="card card-custom">
            <div class="card-header card-header-blue py-3">📝 Informações da Produção</div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-secondary">Produto em Fabricação:</label>
                        <select name="produto_id" class="form-select bg-dark text-white border-secondary" required>
                            <option value="">Selecione o produto...</option>
                            {% for p in produtos %}
                                <option value="{{ p.id }}" {% if apontamento.produto_id == p.id %}selected{% endif %}>{{ p.codigo }} - {{ p.nome }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary">Ordem de Produção (OP):</label>
                        <input type="text" name="ordem_producao" class="form-control bg-dark text-white border-secondary" value="{{ apontamento.ordem_producao }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary">Quantidade de Peças Produzidas:</label>
                        <input type="number" name="quantidade" class="form-control bg-dark text-white border-secondary" min="1" value="{{ apontamento.quantidade }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary">Status da Produção:</label>
                        <select name="status_producao" class="form-select bg-dark text-white border-secondary" required>
                            <option value="Produção Concluída" {% if apontamento.status_producao == 'Produção Concluída' %}selected{% endif %}>Produção Concluída</option>
                            <option value="Produção Pausada" {% if apontamento.status_producao == 'Produção Pausada' %}selected{% endif %}>Produção Pausada</option>
                            <option value="Fim do Turno" {% if apontamento.status_producao == 'Fim do Turno' %}selected{% endif %}>Fim do Turno</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary">Data do Apontamento:</label>
                        <input type="date" name="data" class="form-control bg-dark text-white border-secondary" value="{{ apontamento.data_apontamento }}" required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin.index') }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-blue">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
