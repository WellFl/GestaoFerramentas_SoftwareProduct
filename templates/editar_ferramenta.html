<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Ferramenta - CNC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="py-5">
    <div class="container" style="max-width: 500px;">
        <div class="card card-custom p-4">
            <h3 class="text-white mb-3">✏️ Editar Ferramenta ({{ ferramenta.posicao }})</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-secondary">Nome da Ferramenta</label>
                    <input type="text" name="nome" class="form-control bg-dark text-white border-secondary" value="{{ ferramenta.nome }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-secondary">Limite de Vida Útil (Peças)</label>
                    <input type="number" name="vida_util_limite" class="form-control bg-dark text-white border-secondary" value="{{ ferramenta.vida_util_limite }}" required>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('admin.index') }}" class="btn btn-outline-light btn-sm">Cancelar</a>
                    <button type="submit" class="btn btn-blue btn-sm">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
