<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto - CNC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="py-5">
    <div class="container" style="max-width: 600px;">
        <div class="card card-custom">
            <div class="card-header card-header-blue py-3">
                <h4 class="mb-0 text-white">✏️ Editar Produto / Receita</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-secondary">Código do Produto:</label>
                        <input type="text" name="codigo" class="form-control bg-dark text-white border-secondary" value="{{ produto.codigo }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary">Nome do Produto:</label>
                        <input type="text" name="nome" class="form-control bg-dark text-white border-secondary" value="{{ produto.nome }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary">Ferramentas do Roteiro:</label>
                        <div class="p-2 rounded" style="max-height: 180px; overflow-y: auto; background-color: #0f172a; border: 1px solid #334155;">
                            {% for f in ferramentas %}
                                <div class="form-check mb-1">
                                    <input class="form-check-input" type="checkbox" name="ferramentas_usadas" value="{{ f.posicao }}" id="chk_{{ f.posicao }}" {% if f.posicao in ferramentas_selecionadas %}checked{% endif %} style="background-color: #1e293b; border-color: #475569;">
                                    <label class="form-check-label text-light" for="chk_{{ f.posicao }}" style="cursor:pointer;">
                                        {{ f.posicao }} - {{ f.nome }}
                                    </label>
                                </div>
                            {% endfor %}
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="{{ url_for('admin.index') }}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-blue">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
